<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PomeloO</title>
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="id" href="/id/" />
    <link rel="alternate" hreflang="x-default" href="/en/" />
    <script>
      // Indonesian browsers get /id/, everyone else /en/
      location.replace((navigator.languages || [navigator.language]).some((l) => /^(id|ms)\b/i.test(l)) ? "/id/" : "/en/");
    </script>
    <style>
      body { background: #0b0b0c; color: #f4f4f5; font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      a { color: #ff8a1e; margin: 0 0.75rem; }
    </style>
  </head>
  <body>
    <p><a href="/en/">English</a> <a href="/id/">Bahasa Indonesia</a></p>
  </body>
</html>
